<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · KlienKu</title>
<meta name="description" content="Sign in to KlienKu.">
<meta name="theme-color" content="#F5F4F1">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KlienKu">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<main class="auth">
  <button class="back" id="back" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Sign in
  </button>

  <div class="brand" id="brand">
    <img src="/icons/icon.svg" alt="" width="52" height="52">
    <span class="wordmark-sm">Klien<span>Ku</span></span>
  </div>
  <div class="badge" id="badge" hidden></div>

  <h1 id="title">Welcome back</h1>
  <p class="lead" id="intro"></p>

  <form id="form" novalidate>
    <label class="field" id="emailField">
      <span>Email</span>
      <input id="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="name@company.com">
    </label>
    <label class="field" id="passwordField">
      <span id="passwordLabel">Password</span>
      <input id="password" type="password" autocomplete="current-password">
      <button class="show" type="button" data-show="password">Show</button>
    </label>
    <label class="field" id="confirmField">
      <span>Confirm password</span>
      <input id="confirm" type="password" autocomplete="new-password">
    </label>
    <ul class="rules" id="rules">
      <li data-rule="length">At least 8 characters</li>
      <li data-rule="number">Includes a number</li>
      <li data-rule="match">Passwords match</li>
    </ul>
    <a class="forgot" href="#" id="forgotLink">Forgot password?</a>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <button class="btn btn-primary btn-lg" id="submit" type="submit">Sign in</button>
  </form>

  <div class="sent" id="sent" hidden>
    <a class="btn btn-primary btn-lg" id="openMail" href="message://">Open Mail</a>
    <p class="resend">Didn't get it? <button type="button" id="resend" disabled>Resend in 0:45</button></p>
  </div>

  <footer class="auth-foot">
    <p class="note" id="privateNote">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Private app. Only your account can sign in.
    </p>
    <p class="tip" id="spamTip" hidden>Can't find it? Check your spam or junk folder.</p>
  </footer>
</main>
<script type="module" src="/src/signin.js"></script>
</body>
</html>

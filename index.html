<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KlienKu</title>
<meta name="description" content="Renovasi KL's leads, from the Google Sheet.">
<meta name="theme-color" content="#F5F4F1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KlienKu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/src/styles.css">
<link rel="stylesheet" href="/src/app.css">
</head>
<body>
<!-- Mac and wide screens (≥ 1024 px): sidebar in place of the tab bar and + button -->
<aside class="side" id="side" aria-label="KlienKu">
  <div class="side-brand"><img src="/icons/icon.svg" alt="" width="32" height="32"><span class="lbl">Klien<b>Ku</b></span>
    <button type="button" class="side-toggle" id="sideToggle" aria-label="Hide menu" title="Hide menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M16 15l-3-3 3-3"/></svg></button></div>
  <a class="btn btn-primary side-add" href="/leads/new" data-link aria-label="Add lead">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Add lead</span></a>
  <nav class="side-nav">
    <a href="/" data-link data-tab="/" aria-label="Leads">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="lbl">Leads</span><em id="countLeads"></em></a>
    <a href="/settings" data-link data-tab="/settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg><span class="lbl">Settings</span></a>
  </nav>
  <a class="side-foot" id="sideSheet" target="_blank" rel="noopener" aria-label="Open Google Sheet" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg><span class="lbl">Open Google Sheet</span></a>
</aside>

<main class="view" id="view"></main>

<p class="offline-bar" id="offlineBar" role="status" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76M2 2l20 20"/></svg>Offline · showing what's saved on this device</p>

<a class="fab" id="fab" href="/leads/new" data-link aria-label="Add a lead" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</a>

<nav class="tabbar" id="tabbar" aria-label="Main" hidden>
  <a href="/" data-link data-tab="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Leads</a>
  <a href="/settings" data-link data-tab="/settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>Settings</a>
</nav>
<script type="module" src="/src/app.js"></script>
</body>
</html>
